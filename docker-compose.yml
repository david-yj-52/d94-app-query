services:
  app-server:
    image: ghcr.io/david-yj-52/d94-query:${IMAGE_TAG:-latest}
    container_name: d94-query
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_TYPE: ${CACHE_TYPE:-simple}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-*}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cira-attachments}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-2}

      SOLACE_ENABLE: ${SOLACE_ENABLE:-false}
      SOLACE_SEMP_CREDENTIAL: ${SOLACE_SEMP_CREDENTIAL:-}
      KAFKA_ENABLE: ${KAFKA_ENABLE:-false}
      RABBITMQ_ENABLE: ${RABBITMQ_ENABLE:-false}

      # Eureka 등록 → cloud-gateway 가 lb://d94-query 로 호출
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-cloud-eureka-1:8761/eureka/}
      # 게이트웨이가 찾아올 이름 = 이 컨테이너 이름 (cloud 네트워크에서 DNS 로 풀림)
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME:-d94-query}
    networks:
      - cloud
      - db

# 기존 external 네트워크에 붙는다 (이 compose 는 만들지 않음).
# - cloud: Eureka·Config·Gateway (delap: befw-cloud-network)
# - db   : Postgres 등 (delap: tsh-network → DB_HOST=tsh-postgres)
networks:
  cloud:
    external: true
    name: ${CLOUD_NETWORK_NAME:-befw-cloud-network}
  db:
    external: true
    name: ${DB_NETWORK_NAME:-tsh-network}
